server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://changebattle-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: changebattle-battle-api-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/changebattle-v2-battle-api"
        action: keep
    pipeline_stages:
      - docker: {}
      - static_labels:
          service: changebattle-battle-api
          channel: local
          scope: battle-api
      - json:
          expressions:
            level: level
            event: event
            roomId: roomId
            sessionId: sessionId
            clientActionId: clientActionId
      - structured_metadata:
          level:
          event:
          roomId:
          sessionId:
          clientActionId:
