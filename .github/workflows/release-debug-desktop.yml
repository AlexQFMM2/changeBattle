name: Release Debug Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, must match package.json"
        required: true
        type: string
      source_ref:
        description: "Git ref to build"
        required: true
        default: "v2"
        type: string
      create_github_release:
        description: "Create or update a GitHub prerelease"
        required: true
        default: true
        type: boolean
      update_manifest_url:
        description: "Beta latest.json URL baked into the portable launcher"
        required: true
        default: "http://119.45.240.157/changebattle-beta/latest.json"
        type: string
      official_site_url:
        description: "Beta download/update page URL used in generated latest.json"
        required: true
        default: "http://119.45.240.157/changebattle-beta/"
        type: string
      assets_release_tag:
        description: "Deprecated: assets are loaded from CDN and no longer downloaded during build"
        required: true
        default: "changebattle-v2-assets-v1"
        type: string
      assets_archive_name:
        description: "Deprecated: assets are loaded from CDN and no longer downloaded during build"
        required: true
        default: "changeBattleV2-assets.tgz"
        type: string
      release_notes:
        description: "Release notes written to latest.json, one item per line"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-debug-desktop:
    name: Build Debug Desktop
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CHANGEBATTLE_RELEASE_CHANNEL: beta
      CHANGEBATTLE_UPDATE_MANIFEST_URLS: ${{ inputs.update_manifest_url }}
      CHANGEBATTLE_OFFICIAL_SITE_URL: ${{ inputs.official_site_url }}
      CHANGEBATTLE_DOWNLOAD_PAGE_URL: ${{ inputs.official_site_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceCommit = git rev-parse HEAD
          Write-Host "Checked out source ref: ${{ inputs.source_ref }}"
          Write-Host "Checked out source commit: $sourceCommit"
          "CHANGEBATTLE_SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Resolve MinGW tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $searchRoots = @(
            "${{ github.workspace }}\msys64",
            "C:\msys64",
            "D:\a\_temp"
          ) | Where-Object { Test-Path $_ }
          Write-Host "Searching MinGW tools under:"
          $searchRoots | ForEach-Object { Write-Host "  $_" }
          $gxx = Get-ChildItem -Path $searchRoots -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\(ucrt64|mingw64)\\bin\\g\+\+\.exe$" } |
            Select-Object -First 1
          if (-not $gxx) {
            $gxx = Get-ChildItem -Path $searchRoots -Recurse -Filter "x86_64-w64-mingw32-g++.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $gxx) {
            Write-Host "Available msys64 directories:"
            Get-ChildItem -Path $searchRoots -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("msys64", "ucrt64", "mingw64", "bin") } |
              Select-Object FullName |
              Format-Table -AutoSize
            throw "Unable to resolve MinGW g++."
          }
          $mingwBin = $gxx.Directory.FullName
          $windres = Get-ChildItem -Path $mingwBin -Filter "windres.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windres) {
            $windres = Get-ChildItem -Path $mingwBin -Filter "x86_64-w64-mingw32-windres.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $windres) {
            throw "Unable to resolve windres under $mingwBin."
          }
          Write-Host "Resolved MinGW bin: $mingwBin"
          Write-Host "Resolved g++: $($gxx.FullName)"
          Write-Host "Resolved windres: $($windres.FullName)"
          "CHANGEBATTLE_MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify version
        shell: pwsh
        run: |
          if ("${{ inputs.source_ref }}" -ne "v2") {
            throw "Debug desktop release must build from source_ref=v2, got: ${{ inputs.source_ref }}"
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "package.json version is $packageVersion, expected $env:RELEASE_VERSION"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CDN asset configuration
        shell: pwsh
        run: |
          $config = Get-Content packages\assets-core\src\config.ts -Raw
          if ($config -notmatch "https://assets\.65h26i\.top/beta") {
            throw "ChangeBattle asset CDN base URL is missing from assets-core config."
          }
          $assetBaseUrl = "https://assets.65h26i.top/beta"
          Write-Host "ChangeBattle public assets are resolved from CDN: $assetBaseUrl"

      - name: Run release checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --filter @changebattle-v2/showdown-dex-core build
          pnpm --filter @changebattle-v2/core build
          pnpm --filter @changebattle-v2/core typecheck
          pnpm --filter @changebattle-v2/api typecheck
          pnpm --filter @changebattle-v2/web typecheck
          pnpm --filter @changebattle-v2/desktop typecheck
          pnpm --filter @changebattle-v2/api test:formal-game
          pnpm --filter @changebattle-v2/api test:desktop-offline
          pnpm typecheck

      - name: Build desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CHANGEBATTLE_PROJECT_ROOT = "${{ github.workspace }}"
          pnpm --filter @changebattle-v2/desktop build
          pnpm --filter @changebattle-v2/desktop test:ipc-bundle
          pnpm --filter @changebattle-v2/desktop test:renderer-assets
          pnpm --filter @changebattle-v2/desktop test:formal-worker

      - name: Build launcher
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\build-desktop-launcher.ps1 `
            -SourceRoot "${{ github.workspace }}" `
            -OutputDir "${{ github.workspace }}\release\desktop-launcher" `
            -MingwBin "$env:CHANGEBATTLE_MINGW_BIN"

      - name: Fetch previous update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $previousManifest = "${{ github.workspace }}\release\changebattle\previous-current.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $previousManifest) | Out-Null
          $manifestUrl = (New-Object System.Uri((New-Object System.Uri("$env:CHANGEBATTLE_OFFICIAL_SITE_URL")), "manifests/current.json")).AbsoluteUri
          Write-Host "Fetching previous file manifest: $manifestUrl"
          try {
            Invoke-WebRequest -Uri $manifestUrl -OutFile $previousManifest -TimeoutSec 15
            "CHANGEBATTLE_PREVIOUS_FILE_MANIFEST=$previousManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Previous file manifest saved to $previousManifest"
          } catch {
            Write-Warning "Previous file manifest unavailable; this build will stage every managed object. $($_.Exception.Message)"
          }

      - name: Package portable release
        shell: pwsh
        run: |
          $env:ELECTRON_RUNTIME_PATH = "${{ github.workspace }}\apps\desktop\node_modules\electron\dist"
          $env:CHANGEBATTLE_DESKTOP_LAUNCHER_OUTPUT = "${{ github.workspace }}\release\desktop-launcher"
          $env:CHANGEBATTLE_COMMIT = "$env:CHANGEBATTLE_SOURCE_COMMIT"
          python tools\package_desktop_release.py `
            --electron-runtime-path "$env:ELECTRON_RUNTIME_PATH" `
            --launcher-output-path "$env:CHANGEBATTLE_DESKTOP_LAUNCHER_OUTPUT"

      - name: Generate update metadata
        shell: pwsh
        env:
          RELEASE_MIRROR_URL: https://github.com/${{ github.repository }}/releases/download/desk-debug-v${{ inputs.version }}/ChangeBattle-V2-Desk-portable-debug-v${{ inputs.version }}.zip
          CHANGEBATTLE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $env:CHANGEBATTLE_RELEASE_MIRRORS = "GitHub Release=$env:RELEASE_MIRROR_URL"
          node tools\generate_desktop_update_manifest.mjs $env:RELEASE_VERSION --channel beta --official-site-url "$env:CHANGEBATTLE_OFFICIAL_SITE_URL"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChangeBattle-V2-Desk-portable-debug-v${{ inputs.version }}
          path: release/ChangeBattle-V2-Desk-portable-debug-v${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload update metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: changebattle-beta-update-metadata-v${{ inputs.version }}
          path: |
            release/changebattle/latest.json
            release/changebattle/index.html
            release/changebattle/object-update-summary.json
            release/changebattle/manifests/v${{ inputs.version }}.json
            release/changebattle/manifests/current.json
            release/changebattle/objects/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub prerelease
        if: ${{ inputs.create_github_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desk-debug-v$env:RELEASE_VERSION"
          $zip = "release\ChangeBattle-V2-Desk-portable-debug-v$env:RELEASE_VERSION.zip"
          $title = "ChangeBattle V2 Desk Debug v$env:RELEASE_VERSION"
          $notes = "Debug desktop build from $env:CHANGEBATTLE_SOURCE_COMMIT on source_ref=${{ inputs.source_ref }}.`n`nUpdate metadata remains hosted on the ChangeBattle beta server."
          $releaseExists = $false
          try {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release edit $tag --repo "${{ github.repository }}" --target "$env:CHANGEBATTLE_SOURCE_COMMIT" --title $title --notes $notes --prerelease
            gh release upload $tag $zip --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $zip --repo "${{ github.repository }}" --target "$env:CHANGEBATTLE_SOURCE_COMMIT" --title $title --notes $notes --prerelease
          }
