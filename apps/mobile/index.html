<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101810" />
    <title>ChangeBattle Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.global = window.globalThis || window;
      window.globalThis = window.globalThis || window;
      window.process = window.process || {env: {}};
    </script>
    <script>
      (function () {
        var storageKey = "changebattle:vconsole-enabled";
        var scriptUrl = "https://s2.d2scdn.com/u/qiuzhen/2024/01/23/xLzaZj9WsceVzhFFuYAN4n/vconsole.min.js";
        var loading = false;

        function isEnabled() {
          if (/[?&]vconsole=1\b/.test(window.location.search)) return true;
          if (/[?&]novconsole=1\b/.test(window.location.search)) return false;
          return window.localStorage.getItem(storageKey) === "1";
        }

        function setEnabled(enabled) {
          window.localStorage.setItem(storageKey, enabled ? "1" : "0");
          if (enabled) {
            loadVConsole();
            return;
          }
          if (window.__changeBattleVConsole && typeof window.__changeBattleVConsole.destroy === "function") {
            window.__changeBattleVConsole.destroy();
          }
          window.__changeBattleVConsole = null;
          console.info("[changebattle:vconsole] disabled");
        }

        function loadVConsole() {
          if (window.__changeBattleVConsole || loading) return;
          if (window.VConsole) {
            window.__changeBattleVConsole = new window.VConsole();
            window.__changeBattleVConsole.setOption("maxLogNumber", 5000);
            console.info("[changebattle:vconsole] ready");
            return;
          }
          loading = true;
          var script = document.createElement("script");
          script.src = scriptUrl;
          script.onload = function () {
            loading = false;
            if (!isEnabled() || !window.VConsole) return;
            window.__changeBattleVConsole = new window.VConsole();
            window.__changeBattleVConsole.setOption("maxLogNumber", 5000);
            console.info("[changebattle:vconsole] ready");
          };
          script.onerror = function () {
            loading = false;
            console.warn("[changebattle:vconsole] failed to load");
          };
          document.head.appendChild(script);
        }

        window.__changeBattleDebug = {
          isVConsoleEnabled: isEnabled,
          setVConsoleEnabled: setEnabled,
        };

        if (isEnabled()) loadVConsole();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
