<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChangeBattle V2 Dex Desktop</title>
    <style>
      html,
      body {
        margin: 0;
        min-width: 100%;
        min-height: 100%;
        background: #0b1116;
      }

      body {
        overflow: hidden;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #f7fbff;
        background:
          radial-gradient(circle at 18% 20%, rgba(110, 203, 184, 0.18), transparent 32%),
          linear-gradient(145deg, #0b1116 0%, #142820 54%, #0b1116 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #boot-splash.leaving {
        opacity: 0;
        visibility: hidden;
      }

      .boot-splash-panel {
        width: min(460px, calc(100vw - 48px));
        padding: 20px 22px 18px;
        border: 1px solid rgba(246, 211, 111, 0.52);
        border-radius: 8px;
        background: rgba(8, 18, 18, 0.72);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .boot-splash-title {
        display: block;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.2;
      }

      .boot-splash-detail {
        display: block;
        margin-top: 8px;
        color: rgba(234, 244, 247, 0.82);
        font-size: 13px;
        line-height: 1.6;
      }

      .boot-splash-progress {
        position: relative;
        height: 8px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(247, 251, 255, 0.18);
      }

      .boot-splash-progress::before {
        content: "";
        position: absolute;
        inset: 1px auto 1px 1px;
        width: 44%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f6d36f, #8ed9c0);
        animation: boot-splash-progress 1.45s ease-in-out infinite;
      }

      .boot-splash-tip {
        display: block;
        margin-top: 12px;
        color: rgba(246, 211, 111, 0.86);
        font-size: 12px;
        line-height: 1.5;
      }

      @keyframes boot-splash-progress {
        0% {
          transform: translateX(-12%);
        }

        50% {
          transform: translateX(126%);
        }

        100% {
          transform: translateX(-12%);
        }
      }
    </style>
  </head>
  <body>
    <section id="boot-splash" aria-live="polite">
      <div class="boot-splash-panel">
        <strong class="boot-splash-title">启动 ChangeBattle V2</strong>
        <span class="boot-splash-detail">正在载入图鉴、正式流程和战斗界面</span>
        <div class="boot-splash-progress" aria-hidden="true"></div>
        <span class="boot-splash-tip">首次启动会稍慢，载入完成后将进入上次保存的位置。</span>
      </div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
